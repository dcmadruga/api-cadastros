name: Testes e instalador

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: "p@ss_ci:/x"
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "p@ss_ci:/x"
      DB_NAME: api_db
      DB_TEST_NAME: api_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Preparar bancos (inclui migrações)
        working-directory: api
        run: python preparar_bancos.py
      - name: Testes
        working-directory: api
        run: pytest -v

  instalador:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Gerar instalador
        run: ./scripts/build_instalador.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/*.exe
      - name: Publicar versão (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe \
            --title "API de Cadastros $GITHUB_REF_NAME" \
            --notes-file <(python3 scripts/notas_versao.py "${GITHUB_REF_NAME#v}")
