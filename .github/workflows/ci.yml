name: Testes e instalador

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: "p@ss_ci:/x"
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "p@ss_ci:/x"
      DB_NAME: api_db
      DB_TEST_NAME: api_test
      DB_SCHEMA: api_cadastros
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Preparar bancos (inclui migrações)
        working-directory: api
        run: python preparar_bancos.py
      - name: Testes
        working-directory: api
        run: pytest -v

  instalador:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Gerar instalador
        run: ./scripts/build_instalador.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/*.exe
      - name: Publicar versão nova (quando api/app/versao.py mudar)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=$(python3 -c "exec(open('api/app/versao.py').read()); print(VERSAO)")
          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            echo "A versão v$VERSAO já foi publicada; nada a fazer."
          else
            python3 scripts/notas_versao.py "$VERSAO" > notas.md
            printf '\n\n**Como instalar:** baixe o arquivo .exe abaixo e execute (pede permissão de administrador). A API é instalada como serviço do Windows; para atualizar, rode o instalador novo por cima.\n' >> notas.md
            gh release create "v$VERSAO" dist/*.exe --target "$GITHUB_SHA" \
              --title "API de Cadastros v$VERSAO" --notes-file notas.md
          fi
